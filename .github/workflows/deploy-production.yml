name: Deploy production (self-hosted Cloudflare)

# Der Branch `deploy` bildet den Stand der Live-Seite ab. Veröffentlicht wird
# im Normalfall über den Cloudflare-Build-Trigger auf diesem Branch. Dieser
# Workflow ist nur der manuelle Ersatzweg und braucht die Repo-Secrets
# CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Anwendung bauen
        run: npm run build
        env:
          JNSW_WRANGLER_CONFIG: wrangler.production.jsonc

      - name: D1-Migrationen auf Produktion anwenden
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote --config wrangler.production.jsonc

      - name: Worker deployen
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Ohne --config: Wrangler nimmt die vom Build erzeugte Konfiguration
          # samt Assets (.wrangler/deploy/config.json → dist/server/wrangler.json).
          command: deploy
